spring.application.name=delta-api-postgres
# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

device.integration.mongo-credential=${MONGO_SERVICE_CREDENTIAL:}

# OpenAPI/Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

# RSA PEM: private key in PKCS#8, public key in X.509 format.
auth.private-key=${AUTH_PRIVATE_KEY:file:./.local/private.pem}
auth.public-key=${AUTH_PUBLIC_KEY:file:./.local/public.pem}
auth.issuer=${AUTH_ISSUER:delta-api}
auth.audience=${AUTH_AUDIENCE:delta-api}
auth.key-id=${AUTH_KEY_ID:delta-1}
auth.allowed-origins=${AUTH_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
auth.attempts-per-minute=${AUTH_ATTEMPTS_PER_MINUTE:30}
auth.refresh-ttl=${AUTH_REFRESH_TTL:P30D}

# Redis (refresh-token sessions)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USER:default}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2s}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}
