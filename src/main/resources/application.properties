spring.application.name=delta-api-postgres
# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=DeltaProject#2026_Davi77
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# OpenAPI/Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

# RSA PEM: private key in PKCS#8, public key in X.509 format.
auth.private-key=${AUTH_PRIVATE_KEY:file:./.local/private.pem}
auth.public-key=${AUTH_PUBLIC_KEY:file:./.local/public.pem}
auth.issuer=${AUTH_ISSUER:delta-api}
auth.audience=${AUTH_AUDIENCE:delta-api}
auth.key-id=${AUTH_KEY_ID:delta-1}
auth.allowed-origins=${AUTH_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
auth.attempts-per-minute=${AUTH_ATTEMPTS_PER_MINUTE:30}
