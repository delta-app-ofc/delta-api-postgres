name: CI técnico

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-tecnico-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ci-tecnico
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validar configuração do Compose
        run: docker compose -f docker-compose.test.yml config --quiet
      - name: Executar testes Maven
        run: docker compose -f docker-compose.test.yml run --build --rm tests
      - name: Limpar containers
        if: always()
        run: docker compose -f docker-compose.test.yml down || echo "::warning::Falha na limpeza opcional dos containers de teste."

  report-ci:
    name: Reportar resultado do CI na PR
    if: always() && github.event_name == 'pull_request'
    needs:
      - test
    uses: delta-app-ofc/.github/.github/workflows/report_ci.yml@d30cc21215e716966e2e05a22e0caa1d410f1b65
    with:
      needs_results: ${{ toJSON(needs) }}
    secrets:
      DELTA_ORG_AUTOMATION_TOKEN: ${{ secrets.DELTA_ORG_AUTOMATION_TOKEN }}
    permissions:
      actions: read
      issues: write
      pull-requests: write
